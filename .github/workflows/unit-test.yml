name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    permissions: # Advanced permission for ArtiomTr/jest-coverage-report-action
      checks: write
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        uses: ArtiomTr/jest-coverage-report-action@7f750dd50f5585533321eb7ebc482b936b49a5d4 # v2
        with:
          skip-step: install
          test-script: npm run ci-test

      - name: Publish Coverage Report to Coveralls.io
        if: always() && hashFiles('coverage/**') != ''
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2

      - name: Testspace client install & config
        id: testspace_init
        if: always() && hashFiles('test-results/**') != ''
        uses: testspace-com/setup-testspace@5fc620521eddeba83c1c0dd58f5a524adf474c93 # v1
        with:
          domain: ${{github.repository_owner}}

      - name: Testspace push test content
        if: always() && (steps.testspace_init.outcome == 'success')
        run: |
          output="$(testspace "[Unit Tests]./test-results/*.xml" --link=coveralls)"
          REGEX="(https://[a-z0-9]+.testspace.com/spaces/[0-9]+/result_sets/[0-9]+)"
          [[ $output =~ $REGEX ]]
          result_set_link="${BASH_REMATCH[1]}"
          echo "[TestSpace Integ Test Result set]($result_set_link)" >> "$GITHUB_STEP_SUMMARY"
